[package]
name = "versus-desktop"
version = "0.1.0"
description = "Versus desktop shell"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
name = "versus_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
versus = { path = ".." }
