name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked --offline
      - run: cargo build --release --locked --offline

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libgl1-mesa-dev libgtk-3-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --check
      - run: cargo test --locked --offline
      - run: cargo build --release --locked --offline
