name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --offline --cache npm-cache --include=dev
      - run: cargo fmt --check
      - run: cargo test --locked --offline
      - run: cargo test -p versus-desktop --locked --offline
      - run: npm run build
      - run: npm run tauri -- build --no-bundle

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --offline --cache npm-cache --include=dev
      - run: cargo fmt --check
      - run: cargo test --locked --offline
      - run: cargo test -p versus-desktop --locked --offline
      - run: npm run build
      - run: npm run tauri -- build --no-bundle
