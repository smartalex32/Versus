[package]
name = "versus"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Offline file and directory comparison desktop utility"
license = "MIT"

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "3"

[dependencies]
similar = "=3.2.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
