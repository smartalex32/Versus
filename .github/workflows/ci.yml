name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked --offline
      - run: cargo build --release --locked --offline

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package on Rocky Linux 8 (glibc 2.28)
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            rockylinux/rockylinux:8.10 bash scripts/build-linux-rocky8.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-pr-artifacts
          path: |
            dist/Versus.AppImage
            dist/versus-linux-x86_64.tar.gz
