name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Build the portable executable from vendored dependencies
        run: cargo build --release --locked --offline
      - name: Assemble Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item target/release/versus.exe dist/windows/Versus.exe
          Copy-Item README.md dist/windows/README.md
          Copy-Item LICENSE dist/windows/LICENSE
          New-Item -ItemType Directory -Force -Path dist/windows/licenses/codicons | Out-Null
          Copy-Item assets/codicons/LICENSE,assets/codicons/NOTICE.md dist/windows/licenses/codicons/
          Compress-Archive -Path dist/windows/Versus.exe,dist/windows/README.md,dist/windows/LICENSE,dist/windows/licenses -DestinationPath dist/Versus-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/windows/Versus.exe
            dist/Versus-windows-x86_64.zip

  linux:
    name: Linux (glibc ${{ matrix.glibc }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - glibc: '2.35'
            image: ubuntu:22.04
          - glibc: '2.28'
            image: rockylinux/rockylinux:8.10
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, package and launch on the target baseline
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "${{ matrix.image }}" bash scripts/build-linux.sh "${{ matrix.glibc }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-glibc-${{ matrix.glibc }}-x86_64
          if-no-files-found: error
          path: |
            dist/Versus-linux-x86_64-glibc-${{ matrix.glibc }}.AppImage
            dist/versus-linux-x86_64-glibc-${{ matrix.glibc }}.tar.gz
            dist/linux-runtime-sources-glibc-${{ matrix.glibc }}.tar.gz

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Generate dependency and license inventory from vendor
        shell: pwsh
        run: |
          ./scripts/export-dependency-licenses.ps1 -OutputPath dist/DEPENDENCY-LICENSES.md
          Copy-Item assets/codicons/LICENSE dist/CODICONS-LICENSE.txt
          Copy-Item assets/codicons/NOTICE.md dist/CODICONS-NOTICE.md
      - name: Create offline source bundle
        run: bash scripts/package-source-offline.sh dist/versus-source-offline.tar.gz dist/DEPENDENCY-LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: |
            dist/versus-source-offline.tar.gz
            dist/DEPENDENCY-LICENSES.md
            dist/CODICONS-LICENSE.txt
            dist/CODICONS-NOTICE.md

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
