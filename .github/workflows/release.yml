name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --offline --cache npm-cache
      - run: cargo test --locked --offline
      - run: cargo test -p versus-desktop --locked --offline
      - run: npm run tauri -- build --bundles nsis
      - name: Assemble Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item target/release/versus-desktop.exe dist/windows/Versus.exe
          Copy-Item README.md dist/windows/README.md
          Copy-Item LICENSE dist/windows/LICENSE
          Compress-Archive -Path dist/windows/Versus.exe,dist/windows/README.md,dist/windows/LICENSE -DestinationPath dist/Versus-windows-x86_64.zip
          Copy-Item target/release/bundle/nsis/*-setup.exe dist/Versus-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Versus-Setup.exe
            dist/windows/Versus.exe
            dist/Versus-windows-x86_64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --offline --cache npm-cache
      - run: cargo test --locked --offline
      - run: cargo test -p versus-desktop --locked --offline
      - run: npm run tauri -- build --bundles appimage
      - name: Assemble Linux artifacts
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage dist/Versus.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/Versus.AppImage

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Generate dependency and license inventory
        shell: pwsh
        run: ./scripts/export-dependency-licenses.ps1 -OutputPath dist/DEPENDENCY-LICENSES.md
      - name: Create offline source bundle
        run: bash scripts/package-source-offline.sh dist/versus-source-offline.tar.gz dist/DEPENDENCY-LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: |
            dist/versus-source-offline.tar.gz
            dist/DEPENDENCY-LICENSES.md

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
